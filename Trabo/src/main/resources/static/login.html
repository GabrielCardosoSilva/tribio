<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabio — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }
    body {
      background-color: #1a3b2b; /* Dark green background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .split-container {
      display: flex;
      width: 100%;
      max-width: 1000px;
      min-height: 600px;
      background: #2b4f3c; /* Right side background */
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    /* Left Side: White with illustration */
    .left-side {
      flex: 1;
      background-color: #ffffff;
      position: relative;
      padding: 40px;
      border-top-right-radius: 120px 400px;
      border-bottom-right-radius: 80px 200px;
      display: flex;
      flex-direction: column;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #1a3b2b;
      font-weight: 700;
      font-size: 1.2rem;
      text-decoration: none;
    }
    .logo-container span { color: #52b788; } /* Highlight part of the logo */

    /* Abstract shapes */
    .illustration-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .blob {
      position: absolute;
      width: 300px; height: 300px;
      background: #e1ede8;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      z-index: 1;
    }
    .illustration-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }
    .illustration-content h2 {
      color: #1a3b2b;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    .illustration-content p {
      color: #40916c;
      font-size: 1rem;
    }

    /* Right Side: Form */
    .right-side {
      flex: 1;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #ffffff;
    }
    .right-side h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #e0e0e0;
    }
    .form-group input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid transparent;
      border-radius: 30px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }
    .form-group input::placeholder { color: #a0a0a0; }
    .form-group input:focus { border-color: #74a57f; background: rgba(0, 0, 0, 0.4); }

    .forgot-link {
      display: block;
      text-align: right;
      color: #74a57f;
      text-decoration: none;
      font-size: 0.85rem;
      margin-top: 8px;
    }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #74a57f;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.3s;
    }
    .btn-submit:hover { background: #5a8a65; }

    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #e0e0e0;
    }
    .register-link a {
      color: #74a57f;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .split-container { flex-direction: column; }
      .left-side { border-radius: 0; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; padding-bottom: 60px;}
      .right-side { padding: 40px 20px; }
      .blob { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>

  <div class="split-container">
    <!-- Esquerda: Ilustração e fundo branco -->
    <div class="left-side">
      <a href="/" class="logo-container">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 9.36l-7.1 7.1a2.12 2.12 0 0 1-3-3l7.1-7.1a6 6 0 0 1 9.36-7.94l-3.6 3.6z"></path></svg>
        TRABIO<span>.</span>
      </a>
      
      <div class="illustration-wrapper">
        <div class="blob"></div>
        <div class="illustration-content">
          <h2>Bem-vindo de volta!</h2>
          <p>Conecte-se e encontre os melhores profissionais.</p>
        </div>
      </div>
    </div>

    <!-- Direita: Formulário de Login -->
    <div class="right-side">
      <h1>Login</h1>
      
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="email" id="email" required placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="senha" required placeholder="Enter your password" />
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-submit">Login to Trabio</button>
      </form>

      <div class="register-link">
        Don't have an account? <a href="/cadastro.html">Register Now</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const btn = document.querySelector('.btn-submit');

      btn.disabled = true;
      btn.textContent = 'Carregando...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('trabio_token', data.token);
          localStorage.setItem('trabio_role', data.role);
          
          window.location.href = '/buscar.html';
        } else {
          alert('E-mail ou senha inválidos.');
        }
      } catch (error) {
        console.error(error);
        alert('Erro de conexão ao tentar fazer login.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login to Trabio';
      }
    });
  </script>
</body>
</html>
