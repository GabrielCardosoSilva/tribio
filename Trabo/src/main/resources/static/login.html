<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabio — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

    body {
      background: linear-gradient(135deg, #0f2d1f 0%, #1a3b2b 60%, #2D6A4F 100%);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }

    .split-container {
      display: flex; width: 100%; max-width: 1000px; min-height: 600px;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }

    /* ── Esquerda ────────────────────────────── */
    .left-side {
      flex: 1; background: #fff; position: relative;
      border-top-right-radius: 120px 400px;
      border-bottom-right-radius: 80px 200px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 32px; gap: 24px;
    }

    .left-logo-link {
      position: absolute; top: 32px; left: 32px;
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: #1a3b2b; font-weight: 700; font-size: 1.1rem;
    }
    .left-logo-link img { width: 28px; height: 28px; object-fit: contain; }

    .left-mascot-wrap {
      width: 200px; height: 200px;
      display: flex; align-items: center; justify-content: center;
      animation: floatMascot 3.5s ease-in-out infinite;
    }
    .left-mascot {
      width: 190px; height: 190px; object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(27,67,50,0.25));
    }
    @keyframes floatMascot {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .left-text { text-align: center; }
    .left-text h2 { color: #1a3b2b; font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; }
    .left-text p  { color: #40916c; font-size: 1rem; }

    .left-dots { display: flex; gap: 8px; }
    .left-dots span {
      width: 10px; height: 10px; border-radius: 50%; background: #D8F3DC;
    }
    .left-dots span:nth-child(2) { background: #74C69D; }
    .left-dots span:nth-child(3) { background: #2D6A4F; }

    /* ── Direita ─────────────────────────────── */
    .right-side {
      flex: 1; background: #1B4332;
      padding: 60px 44px; display: flex; flex-direction: column; justify-content: center;
      color: #fff;
    }

    .right-side h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 6px; }
    .right-side .subtitle { color: rgba(255,255,255,0.6); font-size: 0.95rem; margin-bottom: 36px; }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; margin-bottom: 8px; font-size: 0.9rem;
      color: rgba(255,255,255,0.8); font-weight: 500;
    }
    .form-group input {
      width: 100%; padding: 14px 20px;
      background: rgba(0,0,0,0.22); border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 14px; color: #fff; font-size: 1rem; outline: none;
      transition: all 0.3s; font-family: 'Outfit';
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.35); }
    .form-group input:focus {
      border-color: #74C69D; background: rgba(0,0,0,0.35);
      box-shadow: 0 0 0 4px rgba(116,198,157,0.15);
    }

    .forgot-link {
      display: block; text-align: right; color: #74C69D;
      text-decoration: none; font-size: 0.83rem; margin-top: 6px;
      transition: opacity 0.2s;
    }
    .forgot-link:hover { opacity: 0.75; text-decoration: underline; }

    .btn-submit {
      width: 100%; padding: 15px; margin-top: 28px;
      background: #a3e635;
      color: #1B4332; border: none; border-radius: 14px;
      font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: all 0.3s; box-shadow: 0 6px 20px rgba(163, 230, 53, 0.3);
      font-family: 'Outfit';
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(45,106,79,0.5); }
    .btn-submit:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }

    .register-link {
      text-align: center; margin-top: 22px; font-size: 0.88rem;
      color: rgba(255,255,255,0.6);
    }
    .register-link a { color: #74C69D; text-decoration: none; font-weight: 600; }
    .register-link a:hover { text-decoration: underline; }

    .divider {
      display: flex; align-items: center; gap: 12px; margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1);
    }
    .divider span { color: rgba(255,255,255,0.35); font-size: 0.8rem; white-space: nowrap; }

    @media (max-width: 768px) {
      .split-container { flex-direction: column; }
      .left-side {
        border-radius: 0; border-bottom-left-radius: 40px;
        border-bottom-right-radius: 40px; padding: 40px 24px;
        min-height: 280px;
      }
      .left-mascot { width: 120px; height: 120px; }
      .right-side { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <div class="split-container">
    <!-- Esquerda: Mascote + branding -->
    <div class="left-side">
      <a href="/" class="left-logo-link">
        <img src="/images/logo-trabio.png" alt="Trabio" />
        TRABIO
      </a>

      <div class="left-mascot-wrap">
        <img src="/images/logo-trabio.png" alt="Mascote Trabio" class="left-mascot" />
      </div>

      <div class="left-text">
        <h2>Bem-vindo de volta!</h2>
        <p>Conecte-se e encontre os melhores<br>profissionais perto de você.</p>
      </div>

      <div class="left-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Direita: Formulário -->
    <div class="right-side">
      <h1>Entrar</h1>
      <p class="subtitle">Acesse sua conta para continuar</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="••••••••" autocomplete="current-password" />
          <a href="#" class="forgot-link">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">Entrar no Trabio</button>
      </form>

      <div class="divider"><span>ou</span></div>

      <div class="register-link">
        Não tem uma conta? <a href="/cadastro.html">Cadastre-se grátis</a>
      </div>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const btn   = document.getElementById('btn-login');

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('trabio_token', data.token);
          localStorage.setItem('trabio_role',  data.role);

          showToastSuccess('Login realizado com sucesso! Redirecionando...');
          setTimeout(() => { window.location.href = '/buscar.html'; }, 1400);
        } else {
          let errorMsg = 'E-mail ou senha inválidos.';
          try {
            const errorObj = await response.json();
            errorMsg = errorObj.message || errorObj.error || errorMsg;
          } catch (_) {
            errorMsg = await response.text() || errorMsg;
          }
          showToastError(errorMsg);
          btn.disabled = false;
          btn.textContent = 'Entrar no Trabio';
        }
      } catch (error) {
        console.error(error);
        showToastError('Erro de conexão. Verifique sua internet e tente novamente.');
        btn.disabled = false;
        btn.textContent = 'Entrar no Trabio';
      }
    });
  </script>
</body>
</html>
