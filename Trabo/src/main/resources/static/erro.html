<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabio — Erro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body {
      background-color: #F8FAF9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .error-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(220, 38, 38, 0.15);
      border: 1px solid #fee2e2;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .error-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: #ef4444;
    }
    
    .error-icon {
      width: 80px;
      height: 80px;
      background: #fef2f2;
      color: #ef4444;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      margin: 0 auto 24px;
    }
    
    .error-card h1 {
      color: #7f1d1d;
      font-size: 1.8rem;
      margin-bottom: 12px;
      font-weight: 700;
    }
    
    .error-message {
      color: #b91c1c;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    .btn-back {
      display: inline-block;
      padding: 14px 32px;
      background: #ef4444;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      border-radius: 30px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    
    .btn-back:hover {
      background: #dc2626;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-icon">⚠️</div>
    <h1>Ops, algo deu errado!</h1>
    <p class="error-message" id="msg-text">Ocorreu um erro inesperado.</p>
    <button class="btn-back" onclick="window.history.back()">Voltar para a página anterior</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const msg = urlParams.get('msg');
      if (msg) {
        document.getElementById('msg-text').textContent = msg;
      }
    });
  </script>

</body>
</html>
