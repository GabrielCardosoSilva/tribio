# ─────────────────────────────────────────────
#  Perfil DEV — H2 em memória
#  Banco recriado a cada inicialização, com dados de exemplo
#  (ver DataInitializer). Console H2: http://localhost:8080/h2-console
# ─────────────────────────────────────────────

spring.datasource.url=jdbc:h2:mem:trabio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo apenas para desenvolvimento (sobrescrito por JWT_SECRET se definido)
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LXRyYWJpby1sb2NhbC1kZXZlbG9wbWVudC0yNTYtYml0cy1vaw==}

logging.level.com.example.Trabo=DEBUG
