# ─────────────────────────────────────────────
#  Trabio — Application Properties
# ─────────────────────────────────────────────

spring.application.name=Trabio

# ── Datasource (H2 para desenvolvimento) ────
spring.datasource.url=jdbc:h2:mem:trabiodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ─────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────
# ATENÇÃO: gere um secret seguro em produção!
# Ex: openssl rand -base64 64
app.jwt.secret=dHJhYmlvLXNlY3JldC1rZXktbXVpdG8tc2VndXJhLWRldmUtdGVyLWFvLW1lbm9zLTI1Ni1iaXRzLWFxdWktb2s=
app.jwt.expiration-ms=86400000

# ── Upload de arquivos ───────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Swagger / SpringDoc ──────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

