# ─────────────────────────────────────────────
#  Trabio — Application Properties (comum a todos os ambientes)
# ─────────────────────────────────────────────
#  Perfis disponíveis:
#    dev     → H2 em memória + dados de exemplo (padrão)
#    staging → PostgreSQL (Neon) com logs detalhados
#    prod    → PostgreSQL (Neon) otimizado
#  Selecione com SPRING_PROFILES_ACTIVE=prod (variável de ambiente)
#  ou ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
# ─────────────────────────────────────────────

spring.application.name=Trabio
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── JPA ─────────────────────────────────────
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Upload de arquivos ───────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Erros (nunca expor stacktrace ao cliente) ─
server.error.include-stacktrace=never
server.error.include-message=never

# ── Swagger / SpringDoc ──────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
