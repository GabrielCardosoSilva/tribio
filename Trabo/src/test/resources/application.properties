# ─────────────────────────────────────────────
#  Configuração de Testes Automatizados (H2 em memória)
# ─────────────────────────────────────────────
spring.application.name=TrabioTest

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

app.jwt.secret=dHJhYmlvLXNlY3JldC1rZXktbXVpdG8tc2VndXJhLWRldmUtdGVyLWFvLW1lbm9zLTI1Ni1iaXRzLWFxdWktb2s=
app.jwt.expiration-ms=86400000

# Desativa rate limiting rigoroso durante testes para evitar falsos negativos
app.rate-limit.capacity=1000

server.error.include-stacktrace=never
